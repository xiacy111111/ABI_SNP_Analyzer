name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run population_genetics tests
        run: python -m pytest tests/test_population_genetics.py -v

      - name: Run IUPAC conversion tests
        run: python -m pytest tests/test_iupac_conversion.py -v

      - name: Run genotype matrix tests
        run: python -m pytest tests/test_genotype_matrix.py -v

      - name: Run ABIF parser tests
        run: python -m pytest tests/test_abif_parser.py -v
